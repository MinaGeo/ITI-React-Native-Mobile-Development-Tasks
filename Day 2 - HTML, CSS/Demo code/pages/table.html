<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <table cellPadding="15px" cellSpacing="2px" border="1px" borderColor="red" style="text-align: center;">
        <caption>Table Demo</caption>
        <thead>
            <tr>
                <th colspan="2">Cell 1</th>
                <th colspan="2">Cell 2</th>
            </tr>
        </thead>    
        <tbody>

            <tr>
                <td>Cell 1.1</td>
                <td>Cell 1.2</td>
                <td>Cell 1.3</td>
                <td>Cell 1.4</td>

            </tr>
            <tr>
                <td>Cell 2.1</td>
                <td>Cell 2.2</td>
                <td rowspan="3">Cell 2.3</td>
                <td>Cell 2.4</td>

            </tr>
            <tr>
                <td>Cell 3.1</td>
                <td>Cell 3.2</td>
                <!-- <td>Cell 3.3</td> -->
                <td>Cell 3.4</td>

            </tr>
            <tr>
                <td>Cell 4.1</td>
                <td>Cell 4.2</td>
                <!-- <td>Cell 4.3</td> -->
                <td>Cell 4.4</td>

            </tr>
        </tbody>
        <tfoot>
            <tr>
            <td colspan="4">Hello</td></tr>
        </tfoot>

        <!-- </thead> -->





    </table>




</body>
</html>
